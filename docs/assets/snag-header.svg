<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Snag — Give every bug a paper trail.</title>
  <desc id="desc">A report moves from capture to triage to reply. A subtle animated line connects the three stages.</desc>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .flow{stroke-dasharray:5 12;animation:travel 8s linear infinite}
    @keyframes travel{to{stroke-dashoffset:-136}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect width="1200" height="360" rx="20" fill="#111b24"/>
  <path d="M0 300H1200M860 0V360M1040 0V360" stroke="#23323d"/>
  <rect x="52" y="45" width="44" height="44" rx="12" fill="#c7f284"/>
  <path d="M81 57H66a6 6 0 0 0 0 12h10a6 6 0 0 1 0 12H61" fill="none" stroke="#111b24" stroke-width="4"/>
  <text x="112" y="79" fill="#f4f5ef" font-size="35" font-weight="750" letter-spacing="-1">snag</text>
  <text x="54" y="159" fill="#f4f5ef" font-size="44" font-weight="650" letter-spacing="-1.5">Give every bug</text>
  <text x="54" y="213" fill="#f4f5ef" font-size="44" font-weight="650" letter-spacing="-1.5">a paper trail.</text>
  <text x="56" y="267" fill="#a9bac6" font-size="18">The report. The context. The conversation.</text>
  <text x="56" y="334" fill="#a9bac6" font-size="13" letter-spacing="2">EMBEDDABLE WIDGET / GO API / TEAM DASHBOARD</text>
  <path d="M710 172H1090" fill="none" stroke="#3e514c" stroke-width="2"/>
  <path class="flow" d="M710 172H1090" fill="none" stroke="#c7f284" stroke-width="2"/>
  <g fill="#1c2a35" stroke="#607565"><rect x="666" y="128" width="88" height="88" rx="18"/><rect x="846" y="128" width="88" height="88" rx="18"/><rect x="1026" y="128" width="88" height="88" rx="18"/></g>
  <g fill="none" stroke="#c7f284" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="689" y="157" width="42" height="30" rx="5"/><path d="M699 157l4-7h14l4 7"/><circle cx="710" cy="172" r="8"/>
    <path d="M869 155h42v34h-42zM883 155v34M897 155v34M873 164h6M887 170h6M901 163h6"/>
    <path d="M1051 154h38v29h-22l-12 10v-10h-4zM1060 164h20M1060 173h13"/>
  </g>
  <g fill="#c5d1d8" font-size="14" text-anchor="middle"><text x="710" y="244">01 / Capture</text><text x="890" y="244">02 / Triage</text><text x="1070" y="244">03 / Reply</text></g>
</svg>
