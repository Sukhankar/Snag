# Production web server for the Snag website (nginx-unprivileged: runs as a non-root user on :8080).
# Security headers and cache values are generated from site.config.mjs into /etc/nginx/snag/.
# nginx drops inherited add_header lines inside a location that sets its own, so every location
# includes the security headers again.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 16k;          # a static site accepts no uploads
  client_body_timeout 10s;
  client_header_timeout 10s;
  limit_req_zone $binary_remote_addr zone=snag_site:10m rate=30r/s;

  # Pre-compressed files from the build first; dynamic gzip only as a fallback.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css text/plain text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

  log_format snag '$remote_addr "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
  access_log /dev/stdout snag;
  error_log /dev/stderr warn;

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    limit_req zone=snag_site burst=60 nodelay;
    include /etc/nginx/snag/cache.conf;

    error_page 404 /404.html;

    # Host configuration, source maps and dot-files (except .well-known) are never served.
    location = /_headers { return 404; }
    location ~ /\.(?!well-known/) { return 404; }

    location = /404.html {
      internal;
      include /etc/nginx/snag/security-headers.conf;
      add_header Cache-Control $snag_cache_document always;
    }

    location = /sw.js {
      include /etc/nginx/snag/security-headers.conf;
      add_header Cache-Control $snag_cache_document always;
    }

    # Content-hashed CSS/JS: the name changes whenever the content does.
    location ~* "\.[0-9a-f]{10}\.(css|js)$" {
      include /etc/nginx/snag/security-headers.conf;
      add_header Cache-Control $snag_cache_immutable always;
      try_files $uri =404;
    }

    location ~* "\.(png|ico|svg)$" {
      include /etc/nginx/snag/security-headers.conf;
      add_header Cache-Control $snag_cache_static always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/snag/security-headers.conf;
      add_header Cache-Control $snag_cache_document always;
      try_files $uri $uri/ =404;
    }
  }
}
